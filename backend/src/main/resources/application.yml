server:
  port: 8080
  # 首屏性能：JSON/JS/CSS 响应启用 gzip 压缩（含中文的接口响应压缩率 70%+）
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript,image/svg+xml
    min-response-size: 1024

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: recsys-backend
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/recsys?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 1s

# 推荐算法服务（Python FastAPI）
algo:
  base-url: http://127.0.0.1:8001
  # 推荐结果缓存TTL（分钟）
  cache-ttl-minutes: 30

# 平台生成封面（课程设计封面 PNG）目录，相对后端运行目录
app:
  covers-dir: ../recommender/data/covers

logging:
  level:
    com.recsys: info

# AI 客服（智谱 GLM-4-Flash）：API Key 存放在 backend/.env（.gitignore 排除），此处仅为注入占位
ai:
  api-key: ${ZHIPU_API_KEY:}
  base-url: https://open.bigmodel.cn/api/paas/v4/chat/completions
  model: glm-4-flash
  timeout-seconds: 60
